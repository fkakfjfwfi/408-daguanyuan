# 408大观园 · GitHub Pages 自动部署
# 用法：把本目录推送到 GitHub 仓库后，进入 Settings → Pages → Build and deployment →
# Source 选择 "GitHub Actions"，此后每次 push 到 main 都会自动发布最新站点。
name: Deploy 408大观园 to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
